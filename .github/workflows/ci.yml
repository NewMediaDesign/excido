name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uvx ruff check
      - run: uvx ruff format --check

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest] # macos-latest = Apple Silicon
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false # PyTorch wheels are too large to be worth caching

      - name: Free disk space (CUDA wheels are big)
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc

      - run: uv sync --locked
      - run: uv run pytest -q

      - name: Real model smoke test (Lite model on CPU)
        run: |
          uv run excido examples
          uv run excido download general-lite
          uv run excido smoke --models general-lite --device cpu --precisions fp32
