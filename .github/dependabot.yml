# Weekly update PRs for GitHub Actions and Python dependencies (uv.lock).
# CI must pass before merging: PyTorch and the BiRefNet remote code are sensitive to upgrades.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-tools:
        dependency-type: development
    ignore:
      # Pinned on purpose: the CUDA 12.8 wheels stop at torch 2.11 / torchvision 0.26.
      - dependency-name: torch
      - dependency-name: torchvision
