[project]
name = "excido"
version = "0.2.0"
description = "Local, open-source background removal studio powered by BiRefNet"
readme = "README.md"
license = "MIT"
authors = [{ name = "New Media Design" }]
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.10,<3.14"
keywords = ["background-removal", "segmentation", "matting", "birefnet", "pytorch"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: GPU :: NVIDIA CUDA",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "torch>=2.6",
    "torchvision>=0.21",
    # BiRefNet remote code (birefnet.py on Hugging Face)
    "transformers>=4.50",
    "timm>=1.0.23",
    "kornia>=0.8",
    "einops>=0.8",
    "accelerate>=1.0",
    "huggingface-hub>=0.30",
    "numpy",
    "pillow",
    # Local web server
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "requests",
    # MCP server (Claude and other MCP clients)
    "mcp>=2.3",
    # Layered PSD export
    "psd-tools>=1.24,<2",
]

[project.urls]
Homepage = "https://github.com/NewMediaDesign/excido"
Repository = "https://github.com/NewMediaDesign/excido"
Issues = "https://github.com/NewMediaDesign/excido/issues"
Changelog = "https://github.com/NewMediaDesign/excido/blob/main/CHANGELOG.md"

[project.scripts]
excido = "excido.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["excido"]

# --- PyTorch: CUDA 12.8 wheels on Windows/Linux (they also run on CPU-only machines),
# --- regular PyPI wheels on macOS (Apple Silicon, Metal/MPS backend included).
[tool.uv]
environments = [
    "sys_platform == 'win32'",
    "sys_platform == 'linux'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E731"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File", "fastapi.Form"]

[tool.pytest.ini_options]
testpaths = ["tests"]
